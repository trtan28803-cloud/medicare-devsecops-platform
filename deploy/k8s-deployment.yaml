# Kubernetes Manifests cho Hệ thống MediCare (K8s Deployment, Service, Ingress, HPA)
# Dùng cho triển khai Cloud-Native (EKS / AKS / K3s / Minikube)
apiVersion: v1
kind: Namespace
metadata:
  name: medicare-prod
  labels:
    app.kubernetes.io/name: medicare-ehr
    security-tier: hicp-zero-trust
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medicare-config
  namespace: medicare-prod
data:
  HICP_HOST: "0.0.0.0"
  HICP_PORT: "8080"
  HICP_DATA_DIR: "/var/lib/hicp-ehr"
  TRUST_LOCAL_PROXY: "1"
  HICP_SESSION_TIMEOUT: "900"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medicare-ehr-pvc
  namespace: medicare-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-ehr
  namespace: medicare-prod
  labels:
    app: medicare-ehr
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: medicare-ehr
  template:
    metadata:
      labels:
        app: medicare-ehr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: medicare-ehr
          image: medicare-hicp-ehr:v2.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: medicare-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: ehr-data
              mountPath: /var/lib/hicp-ehr
      volumes:
        - name: ehr-data
          persistentVolumeClaim:
            claimName: medicare-ehr-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-ehr-svc
  namespace: medicare-prod
spec:
  type: ClusterIP
  selector:
    app: medicare-ehr
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medicare-ehr-hpa
  namespace: medicare-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medicare-ehr
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
