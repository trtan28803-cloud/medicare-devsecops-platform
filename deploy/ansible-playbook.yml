# Ansible Playbook: Tự động hóa Cài đặt & Cấu hình Hệ thống MediCare (IaC)
# Chạy lệnh: ansible-playbook -i inventory.ini deploy/ansible-playbook.yml --become
---
- name: Deploy & Harden MediCare EHR v2.2 with Wazuh SIEM Integration
  hosts: medicare_servers
  become: true
  vars:
    app_user: hicp-ehr
    app_dir: /home/trtan/hicp-demo
    data_dir: /var/lib/hicp-ehr

  tasks:
    - name: Ensure non-root system user hicp-ehr exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create application and data directories with strict permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ app_dir }}", mode: "0750" }
        - { path: "{{ data_dir }}", mode: "0750" }

    - name: Synchronize MediCare source code to target server
      ansible.builtin.copy:
        src: ../
        dest: "{{ app_dir }}/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    - name: Initialize RBAC accounts and SQLite database idempotently
      ansible.builtin.command:
        cmd: python3 "{{ app_dir }}/scripts/setup.py"
      environment:
        HICP_DATA_DIR: "{{ data_dir }}"
        HICP_NONINTERACTIVE: "1"
      changed_when: false

    - name: Install hardened Systemd unit hicp-ehr.service
      ansible.builtin.copy:
        src: hicp-ehr.service
        dest: /etc/systemd/system/hicp-ehr.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart hicp-ehr

    - name: Deploy custom Wazuh SIEM detection rules (100510-100522)
      ansible.builtin.copy:
        src: wazuh-lab-rules.xml
        dest: /var/ossec/etc/rules/local_rules.xml
        owner: root
        group: wazuh
        mode: "0640"
      failed_when: false
      notify: Restart wazuh-manager

    - name: Ensure hicp-ehr service is enabled and running
      ansible.builtin.systemd:
        name: hicp-ehr
        daemon_reload: true
        enabled: true
        state: started

  handlers:
    - name: Restart hicp-ehr
      ansible.builtin.systemd:
        name: hicp-ehr
        state: restarted

    - name: Restart wazuh-manager
      ansible.builtin.systemd:
        name: wazuh-manager
        state: restarted
      failed_when: false
